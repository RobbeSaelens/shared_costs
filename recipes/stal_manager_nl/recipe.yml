name: 'Stal Manager (Nederlands)'
description: 'Stal Manager in Dutch: Dutch as the default language, with Dutch labels, categories and number formats.'
type: Site
recipes:
  - stal_manager
install:
  - language
  - locale
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        default_langcode: nl
    language.negotiation:
      simpleConfigUpdate:
        url.prefixes:
          en: en
          nl: ''
    core.base_field_override.node.expense.title:
      setProperties:
        langcode: nl
        label: Omschrijving
    core.base_field_override.node.horse.title:
      setProperties:
        langcode: nl
        label: Naam
    core.base_field_override.node.inventory_item.title:
      setProperties:
        langcode: nl
        label: Naam
    core.entity_form_display.node.expense.default:
      setProperties:
        langcode: nl
        content.field_shared_with.settings.decimal_separator: ','
    core.entity_view_display.node.expense.default:
      setProperties:
        langcode: nl
        content.field_quantity.settings.thousand_separator: .
        content.field_quantity.settings.decimal_separator: ','
        content.field_shared_with.settings.decimal_separator: ','
        content.field_shared_with.settings.thousand_separator: .
        content.field_total.settings.thousand_separator: .
        content.field_total.settings.decimal_separator: ','
        content.field_unit_price.settings.thousand_separator: .
        content.field_unit_price.settings.decimal_separator: ','
