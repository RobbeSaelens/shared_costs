        label: Categorie
    field.field.node.expense.field_expense_date:
      setProperties:
        langcode: nl
        label: Datum
    field.field.node.expense.field_inventory_item:
      setProperties:
        langcode: nl
        label: 'Uit de inventaris'
    field.field.node.expense.field_quantity:
      setProperties:
        langcode: nl
        label: Aantal
    field.field.node.expense.field_shared_with:
      setProperties:
        langcode: nl
        label: 'Gedeeld door'
    field.field.node.expense.field_total:
      setProperties:
        langcode: nl
        label: Totaal
