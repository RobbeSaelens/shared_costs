name: 'Stable Manager API'
description: 'Stable Manager for apps: the horses, the inventory and the expenses through JSON:API, for stable managers logged in with a normal session.'
type: 'Site'
recipes:
  - stable_manager
install:
  # With serialization, which also gives the login form a JSON version.
  - jsonapi
config:
  strict: false
  actions:
    # Apps add, change and delete content, not only read it.
    jsonapi.settings:
      simpleConfigUpdate:
        read_only: false
    # What the app does, through JSON:API: see the horses, the inventory and
    # the expenses; add, change and delete expenses and inventory items;
    # change horses, and unpublish one that leaves the stable.
    user.role.stable_manager:
      grantPermissions:
        - 'access content'
        - 'create expense content'
        - 'edit any expense content'
        - 'delete any expense content'
        - 'create inventory_item content'
        - 'edit any inventory_item content'
        - 'delete any inventory_item content'
        - 'edit any horse content'
        - 'administer node published status'
    # JSON:API lists everything that visitors may see: the costs are private,
    # so visitors that aren't logged in may see nothing (as on the demo site).
    user.role.anonymous:
      setProperties:
        permissions: []
