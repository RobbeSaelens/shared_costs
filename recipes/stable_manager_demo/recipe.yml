name: 'Stable Manager demo'
description: 'Stable Manager on a new site, to try it out: the front end (the Stable Manager theme, Gin for the admin pages), two horses and a year of example costs.'
type: 'Site'
recipes:
  - stable_manager_frontend
config:
  strict: false
  actions:
    # What belongs to this site and not to a look: its name. The theme, the
    # front page and the private site come from stable_manager_frontend.
    system.site:
      simpleConfigUpdate:
        name: 'Stable Manager'
