name: 'Stable Manager front end'
description: 'The look of Stable Manager on a new site, without example content: the Stable Manager theme, Gin for forms and admin pages with Admin Toolbar, the dashboard as front page, and a private site.'
type: 'Site'
recipes:
  - stable_manager
install:
  - block
  - toolbar
  - gin_toolbar
  - gin
  # Admin menus open on hover, with quick links (flush caches...).
  - admin_toolbar
  - admin_toolbar_tools
  - stable_manager_theme
config:
  strict: false
  import:
    node:
      - views.view.content
    # The theme's blocks: branding, menus, title, tabs and content.
    stable_manager_theme: '*'
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: /stable
        # The dashboard is for the stable's managers: show the login form.
        page.403: /user/login
    system.theme:
      simpleConfigUpdate:
        default: stable_manager_theme
        admin: gin
    # Gin in the theme's saddle brown, light by default ('0'; '1' is dark and
    # 'auto' follows the system). Everyone can still choose dark for their own
    # account: that's what show_user_theme_settings adds, under "Admin theme
    # settings" when they edit their account.
    gin.settings:
      simpleConfigUpdate:
        preset_accent_color: custom
        accent_color: '#6f4520'
        preset_focus_color: gin
        enable_darkmode: '0'
        show_user_theme_settings: true
        # A bar at the top, so it doesn't sit next to the theme's sidebar.
        classic_toolbar: horizontal
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    # Stable managers add and edit expenses in Gin, like the admin pages.
    user.role.stable_manager:
      grantPermissions:
        - 'view the administration theme'
    # Costs are private, so the site is: visitors that aren't logged in may do
    # nothing, which makes the dashboard show the login form.
    user.role.anonymous:
      setProperties:
        permissions: []
