field.storage_settings.shared_costs_allocation:
  type: field.storage_settings.entity_reference
  label: 'Shared costs field storage settings'

field.field_settings.shared_costs_allocation:
  type: field.field_settings.entity_reference
  label: 'Shared costs field settings'
  mapping:
    total_field:
      type: string
      label: 'Field that holds the total'
      nullable: true

field.value.shared_costs_allocation:
  type: field.value.entity_reference
  label: 'Default value'
  mapping:
    share:
      type: float
      label: 'Share (percentage)'
      nullable: true
      requiredKey: false
    amount:
      type: float
      label: 'Amount'
      nullable: true
      requiredKey: false

views.field.shared_costs_year_month:
  type: views_field
  label: 'Year and month of a date'
  mapping:
    format:
      type: string
      label: 'PHP date format for the month'
    order:
      type: string
      label: 'Sort by month: ASC, DESC or empty'

views.argument.shared_costs_year_month:
  type: views.argument.datetime
  label: 'Year and month of a date, titled by the month name'

field.widget.settings.shared_costs_allocation_table:
  type: mapping
  label: 'Table of sharers widget settings'
  mapping:
    decimal_separator:
      type: string
      label: 'Decimal marker of the amounts'

field.formatter.settings.shared_costs_allocation_default:
  type: field.formatter.settings.entity_reference_label
  label: 'Sharers with share and amount formatter settings'
  mapping:
    show_share:
      type: boolean
      label: 'Show the share'
    show_amount:
      type: boolean
      label: 'Show the amount'
    decimal_separator:
      type: string
      label: 'Decimal marker'
    thousand_separator:
      type: string
      label: 'Thousand marker'
    prefix:
      type: label
      label: 'Prefix'
    suffix:
      type: label
      label: 'Suffix'
