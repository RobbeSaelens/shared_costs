# Weekly updates, as pull requests to develop (where CI runs on every push).
# Not Composer: there is no lock file, and CI always installs the latest
# versions that composer.json allows (Drupal's packages aren't on Packagist,
# which Dependabot can't resolve without a lock file anyway).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  # Playwright, for the visual tests. Its Docker image follows the version, and
  # a new browser can change the screenshots: run tests/visual/run.sh
  # --update-snapshots on the update's branch when they differ.
  - package-ecosystem: npm
    directory: /tests/visual
    target-branch: develop
    schedule:
      interval: weekly
