$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Stat card'
status: stable
description: 'One big number, such as the costs of this month. It counts up to its value when it appears.'
props:
  type: object
  properties:
    amount:
      type: number
      title: Amount
      description: 'The number to count up to. Without it, the value is shown as it is.'
    decimals:
      type: integer
      title: Decimals
    decimal_mark:
      type: string
      title: 'Decimal mark'
    thousands_mark:
      type: string
      title: 'Thousands mark'
    prefix:
      type: string
      title: Prefix
    suffix:
      type: string
      title: Suffix
slots:
  label:
    title: Label
  value:
    title: 'Value, formatted'
  details:
    title: Details
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
